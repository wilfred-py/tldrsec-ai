[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "always"

# Production environment configuration
[environments.production]
variables = {}

# Resource allocation for production workloads
[resources]
memory = "2GB"
cpu = "2 vCPU"

# Database migration and deployment hooks
[hooks]
prebuild = "npm run db:generate"
predeploy = "npm run db:migrate"

# Monitoring and observability
[observability]
logging = true
metrics = true

# Network configuration for security
[networking]
http2 = true
compression = true

# Edge Runtime specific configuration
[edge]
runtime = "edge"
regions = ["us-west-2"]

# Cron job configuration for Railway
[[services]]
name = "tier-aware-cron"
source = "."
build.command = "npm run build"
start.command = "node -e \"const fetch = require('node-fetch'); const runCron = async () => { try { const response = await fetch('https://' + process.env.RAILWAY_STATIC_URL + '/api/cron/unified', { method: 'POST', headers: { 'Authorization': 'Bearer ' + process.env.CRON_SECRET, 'Content-Type': 'application/json' } }); const text = await response.text(); console.log('Cron executed:', response.status, text); } catch (error) { console.error('Cron error:', error); } }; setInterval(runCron, 900000); console.log('Cron scheduler started (15min intervals)');\""
variables = { CRON_TYPE = "tier-aware" }