[build]
builder = "nixpacks"

[deploy]
startCommand = "node scripts/railway-cron.cjs"
# No healthcheck needed for cron-only service
# No restart policy needed - Railway handles cron restarts

# Production environment configuration
[environments.production]
variables = {}

# Resource allocation for cron jobs - reduced from web server requirements
[resources]
memory = "2GB"
cpu = "2 vCPU"

# Database hooks not needed for cron-only service
# Database operations handled by Vercel deployment

# Monitoring and observability
[observability]
logging = true
metrics = true

# Network configuration not needed for cron-only service

# Runtime configuration for Prisma compatibility
[runtime]
runtime = "nodejs"
regions = ["us-west-2"]

# Railway Cron Configuration:
# - Schedule: */15 * * * * (Every 15 minutes)
# - Calls Vercel endpoint: https://tldrsec.app/api/cron/unified
# - Executes SEC filing monitoring and summarization pipeline
# - Exits after completion to allow next scheduled run
