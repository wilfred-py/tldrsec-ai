[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 600
restartPolicyType = "always"

# Production environment configuration
[environments.production]
variables = {}

# Resource allocation for production workloads - optimized for cron performance
[resources]
memory = "4GB"
cpu = "4 vCPU"

# Database migration and deployment hooks
[hooks]
prebuild = "npm run db:generate"
predeploy = "npm run db:migrate"

# Monitoring and observability
[observability]
logging = true
metrics = true

# Network configuration for security
[networking]
http2 = true
compression = true

# Edge Runtime specific configuration
[edge]
runtime = "edge"
regions = ["us-west-2"]

# Railway native cron jobs will be configured in the Railway dashboard
# This eliminates the need for persistent services with setInterval
