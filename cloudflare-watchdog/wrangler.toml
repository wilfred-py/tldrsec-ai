# Cloudflare Worker Configuration for TLDRSec Pipeline Watchdog
# This is an INDEPENDENT worker that monitors pipeline health and triggers
# backup processing when the primary Cloudflare Worker fails.
#
# IMPORTANT: Deploy this to a DIFFERENT Cloudflare account or zone than the
# primary cloudflare-cron worker to ensure true independence.
#
# @see docs/plans/2026-01-09-eliminate-manual-pipeline-intervention.md Phase 4

name = "tldrsec-watchdog"
main = "index.js"
compatibility_date = "2024-10-01"

# Cron schedule: Every 10 minutes (offset from main cron)
# This runs health checks on the pipeline and triggers backup if needed
[triggers]
crons = ["5,15,25,35,45,55 * * * *"]  # Every 10 minutes, offset by 5 min from main

# Environment variables (non-sensitive)
[vars]
PUBLIC_URL = "https://tldrsec.app"
WORKER_VERSION = "1.0.0"
# Number of consecutive failures before triggering backup
FAILURE_THRESHOLD = "3"
# Minutes without success before triggering backup (with 2+ failures)
NO_SUCCESS_THRESHOLD_MINUTES = "20"

# IMPORTANT: Sensitive secrets must be added via Cloudflare Dashboard or wrangler CLI:
# - BACKUP_TRIGGER_SECRET (required for authenticating to backup endpoint)
# - SLACK_WEBHOOK_URL (for alert notifications)
# - SLACK_ALERTS_WEBHOOK_URL (optional, for critical alerts)
#
# Required Commands (run from cloudflare-watchdog/ directory):
#   npx wrangler secret put BACKUP_TRIGGER_SECRET
#   npx wrangler secret put SLACK_WEBHOOK_URL
#
# Verify secrets with: npx wrangler secret list

# Enhanced logging for production monitoring
[observability.logs]
enabled = true

# KV namespace for state persistence (consecutive failures, last success time)
[[kv_namespaces]]
binding = "WATCHDOG_STATE"
id = "d3be6898530242768e718f428f478b24"
