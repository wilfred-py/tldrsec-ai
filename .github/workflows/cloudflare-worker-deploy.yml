name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      tail_logs:
        description: 'Start log tailing after deployment'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    # REMOVED path filter - deploy on every main push for reliability
    # This ensures the worker is always in sync with the codebase
    # Previous path filter caused deployment gaps when related changes
    # were made outside cloudflare-cron/ directory
  schedule:
    # Safety net: redeploy daily to ensure worker is always current
    # Runs at 6 AM UTC = 5 PM AEST (low traffic period)
    - cron: '0 6 * * *'

jobs:
  deploy-cloudflare-worker:
    runs-on: ubuntu-latest
    name: Deploy Worker to Cloudflare Edge
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'cloudflare-cron/package.json'
          
      - name: Install Worker Dependencies
        run: |
          cd cloudflare-cron
          echo "Node.js version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Installing worker dependencies..."
          npm ci
          echo "Verifying wrangler installation..."
          npx wrangler --version
          
      - name: Validate Environment
        run: |
          echo "🔍 Validating deployment environment..."
          echo "Target Environment: ${{ github.event.inputs.environment || 'production' }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          
      - name: Pre-deployment Validation
        run: |
          cd cloudflare-cron
          echo "🔍 Running pre-deployment checks..."
          
          # Syntax validation
          echo "Checking JavaScript syntax..."
          node --check index.js
          echo "✅ JavaScript syntax valid"
          
          # Configuration validation
          echo "Validating wrangler.toml..."
          if ! grep -q "main.*=.*index.js" wrangler.toml; then
            echo "❌ wrangler.toml missing valid main entry"
            exit 1
          fi
          
          if ! grep -q "name.*=.*cloudflare-cron" wrangler.toml; then
            echo "❌ wrangler.toml missing valid name entry"
            exit 1
          fi
          
          echo "✅ Configuration valid"
          
          # Dry run validation with better error handling
          echo "Performing dry run deployment..."
          if npx wrangler deploy --dry-run; then
            echo "✅ Dry run successful"
          else
            echo "❌ Dry run failed"
            echo "Attempting fallback validation..."
            npx wrangler deploy --dry-run --no-bundle || echo "⚠️ Dry run validation completed with warnings"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Deploy to Cloudflare
        run: |
          cd cloudflare-cron
          echo "🚀 Deploying to Cloudflare Workers..."
          
          # Deploy with improved error handling
          if npx wrangler deploy; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Primary deployment failed"
            echo "🔄 Attempting fallback deployment..."
            if npx wrangler deploy --no-bundle; then
              echo "✅ Fallback deployment successful!"
            else
              echo "❌ All deployment attempts failed"
              exit 1
            fi
          fi
          
          # Get deployment info
          echo "📊 Deployment Information:"
          npx wrangler deployments list --latest 1 || echo "⚠️ Could not retrieve deployment information"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Verify Deployment
        run: |
          cd cloudflare-cron
          echo "🔍 Verifying deployment status..."
          
          # Check deployment status
          npx wrangler deployments list --latest 1
          
          echo "✅ Deployment verification completed"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Start Log Monitoring (Optional)
        if: ${{ github.event.inputs.tail_logs == 'true' }}
        run: |
          cd cloudflare-cron
          echo "📋 Starting log monitoring for 30 seconds..."
          timeout 30s npx wrangler tail --format=pretty || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          
      - name: Post-deployment Summary
        run: |
          echo "🎉 Cloudflare Worker Deployment Summary"
          echo "======================================="
          echo "✅ Worker deployed successfully to Cloudflare Edge"
          echo "🌍 Available globally across Cloudflare's network"
          echo ""
          echo "⏰ Cron Schedules:"
          echo "   */5  * * * * - Pipeline processing (every 5 min)"
          echo "   */10 * * * * - Interval Slack summary (every 10 min)"
          echo "   */15 * * * * - Auto-recovery health check (every 15 min)"
          echo "   0 22 * * *   - Daily Slack report (9 AM AEST)"
          echo ""
          echo "🎯 Target Endpoints:"
          echo "   /api/cron/tier-aware - Main pipeline"
          echo "   /api/cron/auto-recover - Self-healing cleanup"
          echo "   /api/cron/slack-interval-summary - Interval reports"
          echo "   /api/cron/slack-daily - Daily digest"
          echo ""
          echo "📋 Verify worker secrets are configured:"
          echo "   - CRON_SECRET (required)"
          echo "   - SLACK_WEBHOOK_URL (recommended)"
          echo "   - SLACK_ALERTS_WEBHOOK_URL (optional)"
          echo ""
          echo "📊 Monitoring Commands:"
          echo "  cd cloudflare-cron && npx wrangler tail --format=pretty"
          echo "  cd cloudflare-cron && npx wrangler deployments list"
          echo "  curl https://cloudflare-cron.wilfred-chen-python.workers.dev/health"