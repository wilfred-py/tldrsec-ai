name: Pipeline Heartbeat Watchdog

# External watchdog that monitors pipeline health and sends email alerts
# when the pipeline appears stalled or unreachable.
#
# This is the "last line of defense" - runs independently of all other systems,
# so even if Cloudflare, Vercel, and the database are all down, this will still
# detect the issue and alert the team.
#
# @see docs/plans/2026-01-26-pipeline-resilience-zero-intervention.md Phase 3

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: 'Force send alert (for testing)'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-heartbeat:
    runs-on: ubuntu-latest

    # Only run in the main repository, not forks
    if: github.repository == 'wilfred-py/tldrsec-ai'

    steps:
      - name: Check Pipeline Health
        id: health
        run: |
          echo "Checking pipeline health at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Fetch health endpoint with timeout
          RESPONSE=$(curl -s -w "\n%{http_code}" --connect-timeout 10 --max-time 30 https://tldrsec.app/api/health/pipeline 2>&1) || true

          # Extract HTTP code (last line) and body (everything else)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Response preview: ${BODY:0:500}"

          # Handle connection failures
          if [[ ! "$HTTP_CODE" =~ ^[0-9]+$ ]]; then
            echo "health_status=UNREACHABLE" >> $GITHUB_OUTPUT
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "error_message=Failed to connect to health endpoint" >> $GITHUB_OUTPUT
            echo "minutes_since_completion=unknown" >> $GITHUB_OUTPUT
            echo "pending_jobs=unknown" >> $GITHUB_OUTPUT
            echo "last_execution=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Handle non-200 responses
          if [ "$HTTP_CODE" != "200" ]; then
            echo "health_status=UNREACHABLE" >> $GITHUB_OUTPUT
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "error_message=Health endpoint returned HTTP $HTTP_CODE" >> $GITHUB_OUTPUT
            echo "minutes_since_completion=unknown" >> $GITHUB_OUTPUT
            echo "pending_jobs=unknown" >> $GITHUB_OUTPUT
            echo "last_execution=unknown" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Parse JSON response
          STATUS=$(echo "$BODY" | jq -r '.status // "UNKNOWN"')
          MINUTES=$(echo "$BODY" | jq -r '.minutesSinceLastCompletion // 999')
          PENDING=$(echo "$BODY" | jq -r '.jobs.pending // 0')
          LAST_EXEC=$(echo "$BODY" | jq -r '.cronExecution.lastExecution // "unknown"')

          echo "health_status=$STATUS" >> $GITHUB_OUTPUT
          echo "minutes_since_completion=$MINUTES" >> $GITHUB_OUTPUT
          echo "pending_jobs=$PENDING" >> $GITHUB_OUTPUT
          echo "last_execution=$LAST_EXEC" >> $GITHUB_OUTPUT

          # Determine if alert is needed
          # Alert if: CRITICAL status OR no completion in 15+ minutes
          if [ "$STATUS" = "CRITICAL" ]; then
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "Alert reason: Status is CRITICAL"
          elif [ "$MINUTES" != "null" ] && [ "$MINUTES" -gt 15 ] 2>/dev/null; then
            echo "alert_needed=true" >> $GITHUB_OUTPUT
            echo "Alert reason: No completion in $MINUTES minutes"
          else
            echo "alert_needed=false" >> $GITHUB_OUTPUT
            echo "Pipeline appears healthy"
          fi

      - name: Send Alert Email
        if: steps.health.outputs.alert_needed == 'true' || github.event.inputs.force_alert == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          STATUS="${{ steps.health.outputs.health_status }}"
          MINUTES="${{ steps.health.outputs.minutes_since_completion }}"
          PENDING="${{ steps.health.outputs.pending_jobs }}"
          LAST_EXEC="${{ steps.health.outputs.last_execution }}"

          # Build email subject
          if [ "${{ github.event.inputs.force_alert }}" = "true" ]; then
            SUBJECT="[TEST] TLDRSec Pipeline Watchdog Alert - $STATUS"
          else
            SUBJECT="TLDRSec Pipeline Stall Alert - $STATUS"
          fi

          # Build email body (escape for JSON)
          BODY="Pipeline Health Alert

          Status: $STATUS
          Last Completion: ${MINUTES:-unknown} minutes ago
          Pending Jobs: ${PENDING:-unknown}
          Last Cron Execution: ${LAST_EXEC:-unknown}

          Health Dashboard: https://tldrsec.app/api/health/pipeline

          This alert was triggered because no successful job completions have been recorded in the last 15 minutes.

          Recommended Actions:
          1. Check health endpoint: https://tldrsec.app/api/health/pipeline
          2. Review Cloudflare Worker logs: npx wrangler tail
          3. Check Vercel function logs
          4. See runbook: docs/runbooks/pipeline-stall-recovery.md

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This is an automated alert from the TLDRSec Pipeline Watchdog."

          # Escape newlines for JSON
          BODY_ESCAPED=$(echo "$BODY" | jq -Rs .)

          # Send email via Resend API
          curl -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"from\": \"TLDRSec Pipeline <pipeline@tldrsec.app>\",
              \"to\": \"wilfred.chen.python@gmail.com\",
              \"subject\": \"$SUBJECT\",
              \"text\": $BODY_ESCAPED
            }"

          echo ""
          echo "Alert email sent to wilfred.chen.python@gmail.com"

      - name: Log Status (No Alert)
        if: steps.health.outputs.alert_needed == 'false' && github.event.inputs.force_alert != 'true'
        run: |
          echo "Pipeline healthy - no alert needed"
          echo "Status: ${{ steps.health.outputs.health_status }}"
          echo "Last completion: ${{ steps.health.outputs.minutes_since_completion }} minutes ago"
          echo "Pending jobs: ${{ steps.health.outputs.pending_jobs }}"
          echo "Last cron execution: ${{ steps.health.outputs.last_execution }}"
