name: Debug Secret Length

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Compare GH secret vs known-good value (no value leak)
        env:
          TOKEN: ${{ secrets.LAUNCH_CRON_TOKEN }}
        run: |
          # GH Actions auto-masks any literal that matches the secret value, so
          # we can safely print length + sha256 prefix to compare against local.
          LEN=${#TOKEN}
          # SHA256 first 16 chars — enough to identify mismatch, not enough to brute-force
          SHA=$(printf "%s" "$TOKEN" | sha256sum | cut -c1-16)
          echo "GH Actions sees: length=$LEN sha256[:16]=$SHA"
          # Also test the route directly — bypass env var, use the secret literal
          echo "::add-mask::$TOKEN"
          HTTP=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -X POST https://tldrsec.app/api/admin/campaign/send \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"region":"eu","emailNumber":1,"dryRun":true}')
          echo "HTTP $HTTP"
          cat /tmp/resp.json | head -3
