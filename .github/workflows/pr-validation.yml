name: PR Validation Pipeline

on:
  # Jobs in this workflow are required status checks (see repo ruleset).
  # `paths:` filters used to live here, but GitHub treats path-skipped
  # required checks as "missing" rather than "passed" — silently blocking
  # any PR that only touches paths outside the filter (e.g. scripts/, docs).
  # See PR #564 for the case that surfaced it. Now runs on every PR/push.
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  infrastructure-validation:
    runs-on: ubuntu-latest
    name: Infrastructure & Code Quality
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Environment Variables Check
        run: |
          echo "Validating required environment variables..."
          # Use test values for PR validation if secrets are not available
          if [ -z "$DATABASE_URL" ]; then
            echo "⚠️ DATABASE_URL not configured, using test database URL"
            export DATABASE_URL="postgresql://test:test@localhost:5432/test_db"
          else
            echo "✅ DATABASE_URL configured"
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "⚠️ ANTHROPIC_API_KEY not configured, using test key"
            export ANTHROPIC_API_KEY="sk-test-anthropic-key"
          else
            echo "✅ ANTHROPIC_API_KEY configured"
          fi
          if [ -z "$RESEND_API_KEY" ]; then
            echo "⚠️ RESEND_API_KEY not configured, using test key"
            export RESEND_API_KEY="re_test_resend_key"
          else
            echo "✅ RESEND_API_KEY configured"
          fi
          if [ -z "$CLERK_SECRET_KEY" ]; then
            echo "⚠️ CLERK_SECRET_KEY not configured, using test key"
            export CLERK_SECRET_KEY="sk_test_abcdefghijklmnopqrstuvwxyz123456789"
          else
            echo "✅ CLERK_SECRET_KEY configured"
          fi
          if [ -z "$OPENROUTER_API_KEY" ] && [ -z "$TLDRSEC_AI_SUMMARIZER" ]; then
            echo "⚠️ OpenRouter API key not configured, using test key"
            export OPENROUTER_API_KEY="sk-or-test-key"
            export TLDRSEC_AI_SUMMARIZER="sk-test-summarizer-key"
          else
            echo "✅ OpenRouter API key configured"
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TLDRSEC_AI_SUMMARIZER: ${{ secrets.TLDRSEC_AI_SUMMARIZER }}
          
      - name: TypeScript & Linting
        run: |
          npm run lint
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test_db' }}
          DIRECT_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test_db' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test-key' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'test-key' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'test-key' }}
          TLDRSEC_AI_SUMMARIZER: ${{ secrets.TLDRSEC_AI_SUMMARIZER || 'test-key' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || 'test-key' }}
          CI: true
          
      - name: Security Scan
        run: npm audit --audit-level=high || echo "⚠️ npm audit found vulnerabilities (non-blocking)"
        
      - name: Unit Tests
        run: |
          # Run stable unit/component tests only. Many test suites are stale after
          # route consolidation (51→12) and AI provider migration (Anthropic→xAI).
          # Stale suites need mock rewrites before re-enabling.
          # See: https://github.com/wilfred-py/tldrsec-ai/issues/TBD
          npm run test -- --forceExit \
            --testPathIgnorePatterns="monitoring|performance|security/timing|filing-retrieval|rate-limiting|infrastructure|transaction|race-conditions|concurrency-stress|edge-cases|real-pipeline|e2e/|services/(filing|filings|__tests__)|lib/ai/(__tests__|summarization|parsers/response)|lib/email/__tests__|parsers/html-parser|pipeline-recovery|email/(subject-line|template-selection|hidden-data|duplicate-detection)|microservices|slack|privacy|agents/|cloudflare/(__tests__|config)|cron/(comprehensive|error-handling|orphaned|email-notifications|handlers|db-email|final-backup|process-filing)|db/(data-migration|pending-onboarding)|middleware/(rate-limit|public-routes)|config/stripe|components/(dashboard-pagination|dashboard-empty|dashboard/(__tests__/integration|dashboard-inline|ticker-table)|landing/hero-section|ui/(service-init|data-table|email))|app/api/(cron|subscription)|validation/(network|filing-content)|lib/(db/(connection-warmer|retry)|sec-edgar/rss|cron/(discovery|bounded)|auth/(subscription|access)|subscription/ticker|email/form144)|openrouter|model-validator|stripe-checkout|waitlist-form|focused-investor|landing-page-(coverage|journeys)|SECFilingEmailTemplate|form4-ai-schema|notification-service|queue-manager|ticker-sync|tickers-table/__tests__|security/(comprehensive|fixes|validation-security|email-validation|api-security)|cron-routing|summaryGeneration|filingDetails|enhancedFiling|form144Parser|resend-client|enhanced-claude|enhanced-summarize|data-consistency|batch-processor.doMock|sections\.test|integration-workflows|monitor-sec|simple-parser|parsing-integration|summarize-with-extraction|cache-invalidation|quarterly-earnings|timeout-scenarios|cloudflare-ip|onboarding-flow\.test|onboarding\.test\.tsx|ai-summarization-pipeline|daily-verification|optimized-filing|cleanup-duplicate|backwards-compat|ticker-filing-integration|pre-build\.test|post-build\.test|build/(integration|pre-build|post-build)|conversion-flow|async-email-queue-comprehensive|security-fixes|security-comprehensive|auto-recover|tier-aware-async|cloudflare-cron/__tests__"
        timeout-minutes: 15
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/testdb' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'test-key' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test-key' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'test-key' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'test-key' }}
          TLDRSEC_AI_SUMMARIZER: ${{ secrets.TLDRSEC_AI_SUMMARIZER || 'test-key' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || 'test-key' }}
          CRON_SECRET: test-secret-key
          NODE_ENV: test
        
      - name: Database Connection Test
        run: npm run db:test || echo "⚠️ Database connection test skipped - no live database available"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test_db' }}
          
      # Skip E2E tests for now as they may consume API credits
      # Uncomment when cost controls are in place
      # - name: End-to-End Tests
      #   run: npm run test:e2e
      #   env:
      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}
      #     ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      #     RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      #     TEST_EMAIL: ${{ secrets.TEST_EMAIL }}

  cloudflare-worker-validation:
    runs-on: ubuntu-latest
    name: Cloudflare Worker Validation
    needs: infrastructure-validation
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'cloudflare-cron/package.json'
          
      - name: Install Worker Dependencies
        run: |
          cd cloudflare-cron
          echo "Node.js version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Installing worker dependencies..."
          npm ci || {
            echo "npm ci failed, trying npm install as fallback..."
            npm install
          }
          echo "Dependencies installed successfully"
          echo "Verifying wrangler installation..."
          npx wrangler --version || echo "⚠️ Wrangler not available"
          
      - name: Verify Wrangler Installation
        run: |
          cd cloudflare-cron
          npx wrangler --version
          echo "✅ Wrangler is available"
        
      - name: Validate Worker Configuration
        run: |
          cd cloudflare-cron
          echo "Validating wrangler.toml configuration..."
          echo "Checking wrangler.toml syntax..."
          if [ ! -f "wrangler.toml" ]; then
            echo "❌ wrangler.toml not found"
            exit 1
          fi
          echo "✅ wrangler.toml exists"
          if [ ! -f "index.js" ]; then
            echo "❌ index.js not found"
            exit 1
          fi
          echo "✅ index.js exists"
          if [ ! -f "package.json" ]; then
            echo "❌ package.json not found"
            exit 1
          fi
          echo "✅ package.json exists"
          
          # Validate wrangler.toml has required fields
          if ! grep -q "main.*=.*index.js" wrangler.toml; then
            echo "❌ wrangler.toml missing 'main' entry"
            exit 1
          fi
          echo "✅ wrangler.toml has valid main entry"
          
      - name: Worker Syntax Check
        run: |
          cd cloudflare-cron
          node --check index.js

      - name: Pipeline Variable Consistency Check
        run: |
          cd cloudflare-cron
          echo "Checking pipeline variable consistency..."

          # Catch stale variable references from deleted pipeline steps.
          # fast-poll was deleted (SEC blocks REST API from Vercel IPs with 403).
          # Pipeline now uses RSS discovery via tier-aware + process-queue.
          STALE_REFS=$(grep -n '\b\(fastPollResult\|fastPollUrl\|fastPollSkipped\)\b' index.js || true)
          if [ -n "$STALE_REFS" ]; then
            echo "FAIL: Found stale fast-poll references in CF Worker:"
            echo "$STALE_REFS"
            echo ""
            echo "fast-poll was deleted. Use discoveryResult instead."
            exit 1
          fi
          echo "OK: No stale pipeline variable references found"

          # Verify the 4 expected pipeline result variables are declared
          for var in cleanupResult discoveryResult fetchResult summarizeResult; do
            if ! grep -q "let ${var}" index.js; then
              echo "WARN: Expected pipeline variable '${var}' not found as 'let' declaration"
            fi
          done
          echo "OK: Pipeline variable declarations verified"

      # Production deployment happens via separate manual workflow
      # This validates the worker configuration and syntax
      - name: Worker Build Validation
        run: |
          cd cloudflare-cron
          echo "Running comprehensive worker build validation..."
          
          # Make validation script executable
          chmod +x build-validation.sh
          
          # Run validation script with fallback handling
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "⚠️ CLOUDFLARE_API_TOKEN not configured, performing local validation only"
            
            # Run local validation without API calls
            echo "📝 Validating JavaScript syntax..."
            node --check index.js
            echo "✅ JavaScript syntax valid"
            
            echo "⚙️ Validating wrangler configuration..."
            if ! grep -q "name.*=.*cloudflare-cron" wrangler.toml; then
              echo "❌ wrangler.toml missing valid name entry"
              exit 1
            fi
            
            if ! grep -q "main.*=.*index.js" wrangler.toml; then
              echo "❌ wrangler.toml missing valid main entry"
              exit 1
            fi
            echo "✅ Configuration valid"
            
            echo "✅ Local validation completed successfully"
          else
            echo "✅ Running full validation with API token"
            ./build-validation.sh
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          

  performance-monitoring:
    runs-on: ubuntu-latest
    name: Performance & Resource Monitoring
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Build Size Analysis
        run: |
          npm ci
          npm run build
          echo "📊 Build Analysis Complete"
          echo "Bundle sizes logged in build output above"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test_db' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || 'sk_test_abcdefghijklmnopqrstuvwxyz123456789' }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || 'sk-or-test-key' }}
          TLDRSEC_AI_SUMMARIZER: ${{ secrets.TLDRSEC_AI_SUMMARIZER || 'sk-test-summarizer-key' }}
          
      - name: Validate Monitoring Configuration
        run: |
          echo "Checking monitoring alert configurations..."
          if [ -f "config/monitoring-alerts.yaml" ]; then
            echo "✅ Monitoring alerts configuration found"
            # Validate YAML syntax
            python3 -c "import yaml; yaml.safe_load(open('config/monitoring-alerts.yaml'))" && echo "✅ Valid YAML syntax" || echo "❌ Invalid YAML"
          else
            echo "❌ Monitoring configuration missing"
          fi